name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow pillow

      - name: Generate Arc Reactor application icons
        run: python gen_icon.py

      - name: Download static ffmpeg.exe
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials.zip"
          $out = Join-Path $env:RUNNER_TEMP "jarvis-ffmpeg"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $exe = Get-ChildItem -Path $out -Recurse -Filter "ffmpeg.exe" |
            Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe was not found in the archive." }
          Copy-Item $exe.FullName "ffmpeg.exe" -Force

      - name: Build JARVIS.exe
        shell: pwsh
        run: ./build_exe.ps1

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/JARVIS.exe
          if-no-files-found: error

  build-deb:
    name: Build Linux DEB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            portaudio19-dev \
            libasound2-dev \
            ffmpeg \
            dpkg-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Generate Arc Reactor application icons
        run: python gen_icon.py

      - name: Build Debian package
        run: |
          chmod +x build_deb.sh
          PYTHON=python ./build_deb.sh

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: jarvis_*.deb
          if-no-files-found: error

  build-dmg:
    name: Build macOS DMG
    # GitHub's arm64 macOS pool has repeatedly failed to assign a runner
    # within 15 minutes. The Intel image is available and its .app also runs on
    # Apple Silicon through Rosetta 2.
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: brew install portaudio ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Generate Arc Reactor application icons
        run: python gen_icon.py

      - name: Build JARVIS.dmg
        run: |
          chmod +x build_mac.sh
          PYTHON=python ./build_mac.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: JARVIS.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-exe, build-deb, build-dmg]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JARVIS ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/JARVIS.exe
            release-assets/jarvis_*.deb
            release-assets/JARVIS.dmg
